name: Live LLM Smoke

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to test
        required: false
        default: main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  live-llm-smoke:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Validate required secrets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "$OPENAI_API_KEY" || { echo "OPENAI_API_KEY is required"; exit 1; }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements-dev.txt
            app/bridge/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run live LLM smoke test
        env:
          PYTHONPATH: app
          RUN_LIVE_LLM_TESTS: "1"
          LLM_PROVIDER: openai
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AUDIT_PATH: ${{ github.workspace }}/data/audit
          LOG_PATH: ${{ github.workspace }}/data/logs
        run: |
          mkdir -p data/audit data/logs
          python -m pytest -q -m live_llm tests/live/test_llm_live.py
