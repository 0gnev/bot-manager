name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements-dev.txt
            app/bridge/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run test suite
        env:
          PYTHONPATH: app
        run: python -m pytest -q

  build-bridge-image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Bridge image
        run: docker build -f containers/bridge/Dockerfile -t bot-manager-bridge:ci .
