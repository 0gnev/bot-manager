name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bridge_test
          POSTGRES_USER: bridge
          POSTGRES_PASSWORD: bridge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bridge"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements-dev.txt
            app/bridge/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run test suite
        env:
          PYTHONPATH: app
          DATABASE_URL: postgresql://bridge:bridge@localhost:5432/bridge_test
        run: python -m pytest -q

  build-bridge-image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Bridge image
        run: docker build -f containers/bridge/Dockerfile -t bot-manager-bridge:ci .
