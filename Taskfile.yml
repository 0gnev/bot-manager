version: '3'

dotenv:
  - .env

tasks:
  bootstrap:
    desc: Install local host tools
    cmds:
      - bash bootstrap/macos.sh
      - bash bootstrap/verify.sh

  init:
    desc: Prepare local folders and env
    cmds:
      - bash scripts/init-local.sh

  sync-knowledge:
    desc: Sync Obsidian vault into local knowledge mirror
    cmds:
      - bash scripts/sync-knowledge.sh

  build:
    desc: Build containers
    cmds:
      - docker compose --env-file .env build

  up:
    desc: Start local stack
    cmds:
      - docker compose --env-file .env up -d --build

  down:
    desc: Stop local stack
    cmds:
      - docker compose --env-file .env down

  restart:
    desc: Restart local stack
    cmds:
      - docker compose --env-file .env down
      - docker compose --env-file .env up -d --build

  logs:
    desc: Follow logs
    cmds:
      - docker compose --env-file .env logs -f --tail=200

  ps:
    desc: Show container status
    cmds:
      - docker compose --env-file .env ps

  test-planerka:
    desc: Run Planerka integration test inside bridge container
    cmds:
      - docker compose --env-file .env run --rm --no-deps bridge python /workspace/scripts/test-planerka.py

  clean:
    desc: Remove recreatable local runtime data
    cmds:
      - docker compose --env-file .env down -v || true
      - bash scripts/clean-local.sh
