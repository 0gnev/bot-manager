version: '3'

dotenv:
  - .env

tasks:
  bootstrap:
    desc: Install local host tools
    cmds:
      - bash bootstrap/macos.sh
      - bash bootstrap/verify.sh

  init:
    desc: Prepare local folders and env
    cmds:
      - bash scripts/init-local.sh

  sync-knowledge:
    desc: Sync Obsidian vault into local knowledge mirror
    cmds:
      - bash scripts/sync-knowledge.sh

  build:
    desc: Build containers
    cmds:
      - docker compose --env-file .env build

  up:
    desc: Start local stack
    cmds:
      - docker compose --env-file .env up -d --build

  down:
    desc: Stop local stack
    cmds:
      - docker compose --env-file .env down

  restart:
    desc: Restart local stack
    cmds:
      - docker compose --env-file .env down
      - docker compose --env-file .env up -d --build

  logs:
    desc: Follow logs
    cmds:
      - docker compose --env-file .env logs -f --tail=200

  ps:
    desc: Show container status
    cmds:
      - docker compose --env-file .env ps

  tunnel:
    desc: Start bridge + cloudflared tunnel (URL printed in logs)
    cmds:
      - 'docker compose --env-file .env --profile tunnel up -d --build bridge tunnel'
      - 'echo ""'
      - 'echo "Waiting for tunnel URL..."'
      - 'sleep 4'
      - 'docker compose --env-file .env logs tunnel 2>&1 | grep -o ''https://[a-z0-9-]*\.trycloudflare\.com'' | tail -1 | xargs -I{} echo "Tunnel URL: {}/webhook/planerka"'

  tunnel-url:
    desc: Print current tunnel URL
    cmds:
      - 'docker compose --env-file .env logs tunnel 2>&1 | grep -o ''https://[a-z0-9-]*\.trycloudflare\.com'' | tail -1 | xargs -I{} echo "Tunnel URL: {}/webhook/planerka"'

  tunnel-logs:
    desc: Follow tunnel + bridge logs
    cmds:
      - docker compose --env-file .env --profile tunnel logs -f --tail=50 bridge tunnel

  tunnel-down:
    desc: Stop tunnel and bridge
    cmds:
      - docker compose --env-file .env --profile tunnel down bridge tunnel

  test-planerka:
    desc: Run Planerka integration test inside bridge container
    cmds:
      - docker compose --env-file .env run --rm --no-deps bridge python /workspace/scripts/test-planerka.py

  test:
    desc: Run the full pytest suite in a disposable Docker container
    cmds:
      - bash scripts/run-pytest-in-docker.sh

  test-system:
    desc: Run end-to-end system tests against fake Telegram/OpenClaw services in Docker
    cmds:
      - bash scripts/run-pytest-in-docker.sh tests/system

  system-test-remote:
    desc: Run remote system tests over SSH using SYSTEM_TEST_* env vars
    cmds:
      - bash scripts/system-test-remote.sh

  clean:
    desc: Remove recreatable local runtime data
    cmds:
      - docker compose --env-file .env down -v || true
      - bash scripts/clean-local.sh
