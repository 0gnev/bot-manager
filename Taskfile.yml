version: '3'

dotenv:
  - .env.local

tasks:
  bootstrap:
    desc: Install local host tools
    cmds:
      - bash bootstrap/macos.sh
      - bash bootstrap/verify.sh

  init:
    desc: Prepare local folders and env
    cmds:
      - bash scripts/init-local.sh

  sync-knowledge:
    desc: Sync Obsidian vault into local knowledge mirror
    cmds:
      - bash scripts/sync-knowledge.sh

  build:
    desc: Build containers
    cmds:
      - docker compose --env-file .env.local build

  up:
    desc: Start local stack
    cmds:
      - docker compose --env-file .env.local up -d --build

  down:
    desc: Stop local stack
    cmds:
      - docker compose --env-file .env.local down

  restart:
    desc: Restart local stack
    cmds:
      - docker compose --env-file .env.local down
      - docker compose --env-file .env.local up -d --build

  logs:
    desc: Follow logs
    cmds:
      - docker compose --env-file .env.local logs -f --tail=200

  ps:
    desc: Show container status
    cmds:
      - docker compose --env-file .env.local ps

  clean:
    desc: Remove recreatable local runtime data
    cmds:
      - docker compose --env-file .env.local down -v || true
      - bash scripts/clean-local.sh
