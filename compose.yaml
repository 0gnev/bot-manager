services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bridge
      POSTGRES_USER: bridge
      POSTGRES_PASSWORD: bridge
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bridge"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  bridge:
    build:
      context: .
      dockerfile: containers/bridge/Dockerfile
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    # Lets the container reach local model servers (Ollama, LM Studio)
    # running on the host, on Linux as well as macOS/Windows.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./app:/workspace/app:ro
      - ./scripts:/workspace/scripts:ro
      - ./config:/workspace/config:ro
      - ./data/state:/workspace/data/state
      - ./data/uploads:/workspace/data/uploads
      - ${OBSIDIAN_VAULT_PATH:-./data/knowledge}:/workspace/data/knowledge
      - ./data/audit:/workspace/data/audit
      - ./data/logs:/workspace/data/logs
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --url http://bridge:8081 --no-autoupdate
    depends_on:
      - bridge
    profiles:
      - tunnel
    restart: unless-stopped

volumes:
  pgdata:
