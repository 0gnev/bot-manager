services:
  openclaw:
    build:
      context: .
      dockerfile: containers/openclaw/Dockerfile
    env_file:
      - .env.local
    volumes:
      - ./config:/workspace/config:ro
      - ./data/state:/workspace/data/state
      - ./data/uploads:/workspace/data/uploads
      - ./data/knowledge:/workspace/data/knowledge
    ports:
      - "127.0.0.1:18789:18789"
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

  bridge:
    build:
      context: .
      dockerfile: containers/bridge/Dockerfile
    env_file:
      - .env.local
    depends_on:
      - openclaw
    volumes:
      - ./app:/workspace/app
      - ./config:/workspace/config:ro
      - ./data/state:/workspace/data/state
      - ./data/uploads:/workspace/data/uploads
      - ./data/knowledge:/workspace/data/knowledge
    ports:
      - "127.0.0.1:8081:8081"
    restart: unless-stopped
