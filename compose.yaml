services:
  openclaw:
    image: alpine/openclaw
    user: root
    env_file:
      - .env
    volumes:
      - ./config/openclaw.json:/root/.openclaw/openclaw.json:ro
      - ./data/openclaw:/workspace
    ports:
      - "127.0.0.1:18789:18789"
    restart: unless-stopped

  bridge:
    build:
      context: .
      dockerfile: containers/bridge/Dockerfile
    env_file:
      - .env
    depends_on:
      openclaw:
        condition: service_started
        required: false
    volumes:
      - ./app:/workspace/app
      - ./scripts:/workspace/scripts
      - ./config:/workspace/config:ro
      - ./data/state:/workspace/data/state
      - ./data/uploads:/workspace/data/uploads
      - ./data/knowledge:/workspace/data/knowledge
    ports:
      - "127.0.0.1:8081:8081"
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --url http://bridge:8081 --no-autoupdate
    depends_on:
      - bridge
    profiles:
      - tunnel
    restart: unless-stopped
